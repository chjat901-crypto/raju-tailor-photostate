<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t7">
<title id="t7">Placeholder: Passport Photos</title>
<defs>
<linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#141826"/><stop offset="1" stop-color="#0a0c14"/>
</linearGradient>
<linearGradient id="gold7" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f0c878"/><stop offset="1" stop-color="#c9962f"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg7)"/>
<g fill="none" stroke="url(#gold7)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
<!-- four passport photo frames -->
<g>
<rect x="220" y="190" width="150" height="180" rx="8"/>
<circle cx="295" cy="255" r="34"/>
<path d="M255 350 Q 295 305 335 350" />
</g>
<g>
<rect x="430" y="190" width="150" height="180" rx="8"/>
<circle cx="505" cy="255" r="34"/>
<path d="M465 350 Q 505 305 545 350" />
</g>
<g opacity="0.6">
<rect x="220" y="400" width="150" height="20" rx="4"/>
<rect x="430" y="400" width="150" height="20" rx="4"/>
</g>
<!-- perforation dashes between the two photos -->
<line x1="405" y1="190" x2="405" y2="370" stroke-dasharray="6 8" stroke-width="2" opacity="0.5"/>
</g>
<text x="400" y="560" font-family="Georgia, serif" font-size="20" fill="#c9962f" text-anchor="middle" opacity="0.65">Placeholder — Passport Photos</text>
</svg>
