<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="heroglow1" cx="30%" cy="25%" r="60%">
<stop offset="0" stop-color="#3a2c12" stop-opacity="0.55"/>
<stop offset="1" stop-color="#0a0c14" stop-opacity="0"/>
</radialGradient>
<radialGradient id="heroglow2" cx="80%" cy="75%" r="55%">
<stop offset="0" stop-color="#1a2440" stop-opacity="0.6"/>
<stop offset="1" stop-color="#0a0c14" stop-opacity="0"/>
</radialGradient>
<linearGradient id="herobase" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d1018"/>
<stop offset="0.5" stop-color="#090b12"/>
<stop offset="1" stop-color="#050609"/>
</linearGradient>
<linearGradient id="herogold" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#f0c878" stop-opacity="0.9"/>
<stop offset="1" stop-color="#c9962f" stop-opacity="0.9"/>
</linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#herobase)"/>
<rect width="1920" height="1080" fill="url(#heroglow1)"/>
<rect width="1920" height="1080" fill="url(#heroglow2)"/>

<!-- flowing fabric folds, very low opacity -->
<g fill="none" stroke="#c9962f" stroke-width="1.5" opacity="0.16">
<path d="M-100 780 C 300 700 500 860 900 760 C 1300 660 1500 820 2020 740"/>
<path d="M-100 840 C 320 760 560 900 950 820 C 1340 740 1560 880 2020 800"/>
<path d="M-100 900 C 340 830 600 950 1000 880 C 1360 820 1600 930 2020 860"/>
</g>

<!-- large stitched thread arc, signature motif -->
<path d="M -50 300 C 400 120 900 480 1400 220 C 1650 100 1850 180 1970 120"
fill="none" stroke="url(#herogold)" stroke-width="2.5" stroke-dasharray="10 14" opacity="0.5"/>

<!-- measuring tape ribbon, top right, faint -->
<g opacity="0.14" stroke="#f0c878" stroke-width="1" fill="none">
<path d="M1500 40 C 1650 120 1700 260 1600 360 C 1520 440 1560 540 1660 560"/>
</g>
</svg>
