<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t5">
<title id="t5">Placeholder: Photostat Machine</title>
<defs>
<linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#141826"/><stop offset="1" stop-color="#0a0c14"/>
</linearGradient>
<linearGradient id="gold5" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f0c878"/><stop offset="1" stop-color="#c9962f"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg5)"/>
<g fill="none" stroke="url(#gold5)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
<rect x="200" y="250" width="400" height="180" rx="16"/>
<rect x="230" y="200" width="340" height="60" rx="10" opacity="0.7"/>
<!-- glass scan bed highlight -->
<rect x="250" y="212" width="300" height="36" rx="4" fill="#f0c878" opacity="0.12" stroke-width="1.5"/>
<!-- control panel -->
<circle cx="540" cy="290" r="10"/>
<rect x="500" y="310" width="70" height="16" rx="4" opacity="0.6"/>
<!-- paper tray -->
<rect x="230" y="430" width="120" height="16" rx="4" opacity="0.5"/>
<rect x="450" y="430" width="120" height="16" rx="4" opacity="0.5"/>
<!-- light scan beam -->
<line x1="260" y1="230" x2="540" y2="230" stroke-width="4" opacity="0.4"/>
</g>
<text x="400" y="560" font-family="Georgia, serif" font-size="20" fill="#c9962f" text-anchor="middle" opacity="0.65">Placeholder — Photostat Machine</text>
</svg>
